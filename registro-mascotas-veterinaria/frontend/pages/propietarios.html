<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propietarios</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<header class="navbar">
    <div class="logo">🐾 Veterinaria</div>
    <nav>
        <a href="../index.html">Inicio</a>
        <a href="propietarios.html">Propietarios</a>
        <a href="mascotas.html">Mascotas</a>
        <a href="vacunas.html">Vacunas</a>
    </nav>
</header>

<main class="container">
    <h1>Registrar propietario</h1>
    <form class="form-card">
        <label>Nombre
            <input type="text" name="nombre" placeholder="Nombre">
        </label>
        <label>Apellido
            <input type="text" name="apellido" placeholder="Apellido">
        </label>
        <label>Teléfono
            <input type="tel" name="telefono" placeholder="Teléfono">
        </label>
        <label>Correo
            <input type="email" name="correo" placeholder="correo@ejemplo.com">
        </label>
        <label>Dirección
            <input type="text" name="direccion" placeholder="Dirección">
        </label>
        <div class="actions">
            <button type="submit" class="button">Guardar</button>
            <button type="reset" class="button secondary">Cancelar</button>
        </div>
    </form>
</main>
</body>
</html>

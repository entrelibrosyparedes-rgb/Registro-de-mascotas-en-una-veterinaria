<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacunas | Veterinaria</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header class="navbar">
    <div class="logo">🐾 Veterinaria</div>
    <nav>
        <a href="../index.html">Inicio</a>
        <a href="propietarios.html">Propietarios</a>
        <a href="mascotas.html">Mascotas</a>
        <a href="vacunas.html">Vacunas</a>
    </nav>
</header>

<main class="container">
    <h1>Historial de vacunas</h1>
    <p>Registra las vacunas y relaciónalas con una mascota.</p>

    <h2>Registrar vacuna</h2>

    <form id="formVacuna" class="form-card">

        <label for="mascotaId">Mascota
            <select id="mascotaId" name="mascotaId" required>
                <option value="">Cargando mascotas...</option>
            </select>
        </label>

        <label for="nombreVacuna">Vacuna
            <input
                type="text"
                id="nombreVacuna"
                name="nombre"
                placeholder="Nombre de la vacuna"
                maxlength="100"
                required
            >
        </label>

        <label for="fechaAplicacion">Fecha de aplicación
            <input
                type="date"
                id="fechaAplicacion"
                name="fechaAplicacion"
                required
            >
        </label>

        <label for="proximaFecha">Próxima fecha
            <input
                type="date"
                id="proximaFecha"
                name="proximaFecha"
            >
        </label>

        <label for="observaciones">Observaciones
            <textarea
                id="observaciones"
                name="observaciones"
                placeholder="Observaciones"
            ></textarea>
        </label>

        <div class="actions">
            <button type="submit" class="button">
                Guardar vacuna
            </button>

            <button type="reset" class="button secondary">
                Limpiar formulario
            </button>
        </div>
    </form>

    <p id="mensajeVacuna" role="status"></p>
</main>

<script src="../js/vacunas.js"></script>

</body>
</html>
